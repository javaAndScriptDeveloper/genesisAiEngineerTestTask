name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"        # weekly: live API contract check
  workflow_dispatch:
    inputs:
      run_network:
        description: "Also run the live Wikimedia API tests"
        type: boolean
        default: false

defaults:
  run:
    working-directory: wikipedia-interest

jobs:
  lint:
    name: ruff (lint + format check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uvx ruff check .
      - run: uvx ruff format --check wiki_interest scripts tests eval

  unit:
    name: unit tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run pytest -q          # offline: HTTP mocked, network tests deselected by default
      - name: eval harness tests
        working-directory: wikipedia-interest/eval
        run: uv sync --frozen && uv run pytest -q

  validate-skill:
    name: Agent Skills spec
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx --from skills-ref agentskills validate wikipedia-interest

  smoke:
    name: CLI smoke (offline artifacts)
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: report and compare on the shipped examples (no network)
        run: |
          uv run scripts/wiki_interest.py report --run examples/02-astronomy-uk --title "CI smoke" --notes "smoke" --lang uk --out /tmp/smoke
          uv run scripts/wiki_interest.py compare --runs examples/03-english-multi examples/03b-english-12m --out /tmp/smoke
          uv run python -c "import pypdf; assert len(pypdf.PdfReader('/tmp/smoke/report.pdf').pages) == 1"
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: /tmp/smoke/

  network:
    name: live Wikimedia API tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_network)
    env:
      WIKI_INTEREST_CONTACT: ci@github-actions
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -m network -q
