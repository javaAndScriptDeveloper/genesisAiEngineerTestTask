[project]
name = "wikipedia-interest-eval"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "python-dotenv>=1.0"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["."]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"test_*.py" = ["E501"]
